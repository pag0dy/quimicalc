<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Química</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 2rem;
        }
        nav {
            margin-bottom: 1.5rem;
        }
        nav a {
            margin-right: 15px;
            text-decoration: none;
            color: #0077cc;
        }
        nav a:hover {
            text-decoration: underline;
        }
        hr {
            margin-top: 1rem;
        }
        .formula-box {
            display: inline-block;
            background-color: #f8f9fa;
            border: 1px solid #ccc;
            padding: 0.75rem 1rem;
            margin: 1.5rem 0;
            border-radius: 8px;
            font-size: 1.2rem;
        }
        .menu-toggle {
            display: none;
            background-color: #0077cc;
            color: white;
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            margin-bottom: 1rem;
        }

        nav ul.menu {
            list-style: none;
            padding: 0;
            margin: 0 0 1rem 0;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        nav ul.menu li {
            display: inline;
        }

        nav ul.menu a {
            text-decoration: none;
            color: #0077cc;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .menu-toggle {
                display: inline-block;
            }

            nav ul.menu {
                display: none;
                flex-direction: column;
                gap: 0;
            }

            nav ul.menu.show {
                display: flex;
            }

            nav ul.menu li {
                margin-bottom: 10px;
            }
        }
    </style>
    <script>
    MathJax = {
    tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
    }
    };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <h1>🧪 Calculadora Química</h1>
    <nav>
    <button class="menu-toggle" onclick="toggleMenu()">☰ Menú</button>
        <ul id="menu" class="menu">
            <li><a href="{% url 'home' %}">Inicio</a></li>
            <li><a href="{% url 'calculo_moles' %}">Cálculo de moles</a></li>
            <li><a href="{% url 'calculo_masa_molar' %}">Masa molar</a></li>
            <li><a href="{% url 'calculo_composicion' %}">Composición porcentual</a></li>
            <li><a href="{% url 'calculo_formula_empirica' %}">Fórmula empírica</a></li>
            <li><a href="{% url 'calculo_formula_molecular' %}">Fórmula molecular</a></li>
            <li><a href="{% url 'calculo_avogadro' %}">Partículas</a></li>
            <li><a href="{% url 'creditos' %}">Créditos</a></li>
        </ul>
    </nav>
    <hr>
    {% block content %}{% endblock %}
    <script>
    function toggleMenu() {
        document.getElementById("menu").classList.toggle("show");
        }
    </script>
    <footer style="margin-top: 2rem; padding: 1rem 0; text-align: center; color: #666; font-size: 0.9rem; border-top: 1px solid #ccc;">
    &copy; pag0dy 2025
</footer>
</body>
</html>
