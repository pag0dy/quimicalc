{% extends "calculos/base.html" %}

{% block content %}
<h2>Cálculo de fórmula molecular</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Calcular</button>
</form>

{% if error %}
    <p style="color: red;"><strong>{{ error }}</strong></p>
{% elif formula_str %}
    <h3>Fórmula molecular:</h3>
    <p>{{ formula_str }}</p>
{% endif %}
{% endblock %}
