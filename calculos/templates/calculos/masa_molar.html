{% extends "calculos/base.html" %}

{% block content %}
<h2>Cálculo de masa molar</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Calcular</button>
</form>

{% if error %}
    <p style="color: red;"><strong>{{ error }}</strong></p>
{% elif resultado %}
    <p><strong>Masa molar:</strong> {{ resultado }} g/mol</p>
{% endif %}
{% endblock %}
